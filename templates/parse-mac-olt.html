<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPON Data Parser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            color: white;
            text-decoration: none;
        }

        .content {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        #dataInput {
            width: 100%;
            height: 400px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        #dataInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .results {
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            height: 400px;
            overflow: auto;
            background: #f8f9fa;
        }

        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .table-container {
            padding: 15px;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .data-table th {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e6ed;
            transition: background-color 0.2s ease;
        }

        .data-table tr:hover {
            background-color: #f8f9fa;
        }

        .data-table tr:nth-child(even) {
            background-color: #fafbfc;
        }

        .data-table tr:nth-child(even):hover {
            background-color: #f1f3f4;
        }

        .mac-address {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .csid-code {
            color: #27ae60;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .status-online {
            background: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-offline {
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .onu-id {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #34495e;
            background: #ecf0f1;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .copy-btn:hover {
            background: #5a6fd8;
        }

        .export-section {
            grid-column: 1 / -1;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e6ed;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        .placeholder {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .export-buttons {
                justify-content: center;
            }

            .data-table {
                font-size: 12px;
            }

            .data-table th,
            .data-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="home-btn">
                <svg class="icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Home
            </a>
            <h1>🌐 EPON Data Parser</h1>
            <p>Paste your EPON data to extract MAC addresses and CSID codes</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <div class="section-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                    Input Data
                </div>
                <textarea 
                    id="dataInput" 
                    placeholder="Paste your OLT EPON data here...&#10;&#10;Expected format (tab-separated):&#10;ONU ID | Status | MAC Address | Description | RTT(TQ) | Type | Auth Flag | Exchange | Auth Mode | Loid/Password | Action&#10;&#10;Example:&#10;EPON0/1:2 | Offline | 48:35:2E:47:83:18 | TLB11-DEWI_MULYANI_SI-BK004758 | ..."
                ></textarea>
            </div>
            
            <div class="output-section">
                <div class="section-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    Parsed Results
                </div>
                <div class="results">
                    <div class="stats">
                        <span>Total Items: <span id="totalCount">0</span></span>
                        <span>Online: <span id="onlineCount">0</span></span>
                        <span>Offline: <span id="offlineCount">0</span></span>
                        <span>CSID Codes: <span id="csidCount">0</span></span>
                    </div>
                    <div class="table-container" id="tableContainer">
                        <div class="placeholder">
                            No data parsed yet. Paste your EPON data above to get started.
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="export-section">
                <div class="section-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10,9 9,9 8,9"/>
                    </svg>
                    Export Options
                </div>
                <div class="export-buttons">
                    <button class="export-btn" onclick="exportAsCSV()">
                        <svg class="icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14,2 14,8 20,8"/>
                        </svg>
                        Export as CSV
                    </button>
                    <button class="export-btn" onclick="exportAsJSON()">
                        <svg class="icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14,2 14,8 20,8"/>
                        </svg>
                        Export as JSON
                    </button>
                    <button class="export-btn" onclick="copyAllToClipboard()">
                        <svg class="icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        Copy All
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = [];

        // Parse data automatically when input changes
        document.getElementById('dataInput').addEventListener('input', function() {
            parseData();
        });

        function parseData() {
            const inputData = document.getElementById('dataInput').value;
            const lines = inputData.split('\n');
            parsedData = [];
            
            lines.forEach((line, index) => {
                if (line.trim() === '') return;
                
                // Skip header line
                if (index === 0 && line.includes('ONU ID') && line.includes('Status')) {
                    return;
                }
                
                // Split by tab or multiple spaces
                const columns = line.split(/\t+|\s{2,}/).map(col => col.trim());
                
                if (columns.length >= 4) {
                    const onuId = columns[0];
                    const status = columns[1];
                    const macAddress = columns[2];
                    const description = columns[3];
                    
                    // Check if this looks like valid data (not header)
                    if (onuId && status && macAddress && description && 
                        !onuId.includes('ONU ID') && 
                        macAddress.match(/^[0-9A-Fa-f:]{17}$/)) {
                        
                        // Extract SI-BK code from description (treating as CSID)
                        const csidMatch = description.match(/SI-BK\d{6}/);
                        const csidCode = csidMatch ? csidMatch[0] : null;
                        
                        // Include all valid entries, not just those with CSID
                        parsedData.push({
                            onuId: onuId,
                            status: status,
                            macAddress: macAddress,
                            description: description,
                            csidCode: csidCode
                        });
                    }
                }
            });
            
            displayResults();
        }

        function displayResults() {
            const tableContainer = document.getElementById('tableContainer');
            const totalCount = document.getElementById('totalCount');
            const onlineCount = document.getElementById('onlineCount');
            const offlineCount = document.getElementById('offlineCount');
            const csidCount = document.getElementById('csidCount');
            
            const onlineItems = parsedData.filter(item => item.status.toLowerCase() === 'online');
            const offlineItems = parsedData.filter(item => item.status.toLowerCase() === 'offline');
            const itemsWithCSID = parsedData.filter(item => item.csidCode);
            
            totalCount.textContent = parsedData.length;
            onlineCount.textContent = onlineItems.length;
            offlineCount.textContent = offlineItems.length;
            csidCount.textContent = itemsWithCSID.length;
            
            if (parsedData.length === 0) {
                tableContainer.innerHTML = '<div class="placeholder">No OLT data found. Paste your EPON OLT data with tab-separated columns above.</div>';
                return;
            }
            
            const tableHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ONU ID</th>
                            <th>Status</th>
                            <th>MAC Address</th>
                            <th>CSID</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${parsedData.map((item, index) => `
                            <tr>
                                <td><span class="onu-id">${item.onuId}</span></td>
                                <td><span class="status-${item.status.toLowerCase()}">${item.status}</span></td>
                                <td><span class="mac-address">${item.macAddress}</span></td>
                                <td>${item.csidCode ? `<span class="csid-code">${item.csidCode}</span>` : '<span style="color: #95a5a6;">N/A</span>'}</td>
                                <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${item.description}">${item.description}</td>
                                <td>
                                    <button class="copy-btn" onclick="copyRowToClipboard('${item.onuId}', '${item.macAddress}', '${item.csidCode || 'N/A'}', ${index})">
                                        Copy
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            tableContainer.innerHTML = tableHTML;
        }

        function copyRowToClipboard(onuId, macAddress, csidCode, index) {
            const textToCopy = `${onuId}\t${macAddress}\t${csidCode}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const buttons = document.getElementsByClassName('copy-btn');
                const button = buttons[index];
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.background = '#27ae60';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#667eea';
                }, 1000);
            });
        }

        function exportAsCSV() {
            if (parsedData.length === 0) {
                alert('No data to export!');
                return;
            }
            
            let csvContent = 'ONU ID,Status,MAC Address,CSID,Description\n';
            parsedData.forEach(item => {
                csvContent += `"${item.onuId}","${item.status}","${item.macAddress}","${item.csidCode || 'N/A'}","${item.description}"\n`;
            });
            
            downloadFile(csvContent, 'olt_epon_parsed_data.csv', 'text/csv');
        }

        function exportAsJSON() {
            if (parsedData.length === 0) {
                alert('No data to export!');
                return;
            }
            
            const jsonContent = JSON.stringify(parsedData, null, 2);
            downloadFile(jsonContent, 'epon_parsed_data.json', 'application/json');
        }

        function copyAllToClipboard() {
            if (parsedData.length === 0) {
                alert('No data to copy!');
                return;
            }
            
            const allData = parsedData.map(item => `${item.onuId}\t${item.macAddress}\t${item.csidCode || 'N/A'}`).join('\n');
            navigator.clipboard.writeText(allData).then(() => {
                const button = document.querySelector('.export-btn:last-child');
                const originalText = button.innerHTML;
                button.innerHTML = button.innerHTML.replace('Copy All', 'Copied!');
                button.style.background = 'linear-gradient(135deg, #27ae60 0%, #229954 100%)';
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.style.background = 'linear-gradient(135deg, #27ae60 0%, #229954 100%)';
                }, 2000);
            });
        }

        function downloadFile(content, fileName, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
