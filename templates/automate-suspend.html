<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #4f46e5;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .device-card {
            background: #f8fafc;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .device-card:hover {
            border-color: #4f46e5;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15);
        }

        .device-card.selected {
            border-color: #10b981;
            background: #f0fdf4;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
        }

        .device-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .device-card:hover::before,
        .device-card.selected::before {
            transform: scaleX(1);
        }

        .device-card.selected::before {
            background: linear-gradient(90deg, #10b981, #059669);
        }

        .device-card h3 {
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .device-card p {
            color: #6b7280;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .device-card .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            margin-top: 10px;
        }

        .status.online {
            background: #dcfce7;
            color: #166534;
        }

        .status.offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .device-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 20px;
            height: 20px;
            accent-color: #10b981;
            cursor: pointer;
            z-index: 10;
        }

        .batch-controls {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .selected-count {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .results-table th,
        .results-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .results-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .results-table tr:hover {
            background: #f8fafc;
        }

        .results-table td:first-child {
            font-weight: 500;
            color: #4f46e5;
        }

        .device-source {
            background: #eff6ff;
            color: #1e40af;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #dc2626;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #16a34a;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #f59e0b;
        }

        .btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(79, 70, 229, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn.secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }

        .btn.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .hidden {
            display: none;
        }

        .current-devices {
            background: #eff6ff;
            border: 2px solid #3b82f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .current-devices h3 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .device-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .device-tag {
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .filter-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-section select,
        .filter-section input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-right: 10px;
            font-size: 0.9em;
        }

        .device-count {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .home-button {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .home-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #6b7280;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="home-button">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <h1>MikroTik Dashboard</h1>
            <p>Manage CO Tanjung Balai Karimun</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>CO TANJUNG BALAI KARIMUN</h2>
                
                <div class="batch-controls">
                    <span class="selected-count" id="selectedCount">0 devices selected</span>
                    <button class="btn success" id="batchConnectBtn" onclick="connectToSelectedDevices()" disabled>
                        Connect to Selected Devices
                    </button>
                    <button class="btn secondary" onclick="clearSelection()">Clear Selection</button>
                    <button class="btn secondary" onclick="selectAll()">Select All</button>
                </div>
                
                <div class="filter-section">
                    <select id="locationFilter" onchange="filterDevices()">
                        <option value="">All Locations</option>
                        <option value="Azam Branch">CO AZAM</option>
                        <option value="Meral Branch">CO MERAL</option>
                        <option value="Mutiara Branch">CO MUTIARA</option>
                        <option value="Office Branch">CO OFFICE</option>
                        <option value="PasirPanjang Branch">CO PASIR PANJANG</option>
                    </select>
                    <select id="statusFilter" onchange="filterDevices()">
                        <option value="">All Status</option>
                        <option value="online">Online</option>
                        <option value="offline">Offline</option>
                    </select>
                    <input type="text" id="searchFilter" placeholder="Search by name or IP..." onkeyup="filterDevices()">
                </div>
                
                <div class="device-count" id="deviceCount"></div>
                
                <div class="device-grid" id="deviceGrid">
                    <!-- Devices will be populated here -->
                </div>
            </div>
            
            <div class="section" id="resultsSection" style="display: none;">
                <h2>Combined Firewall Address List Results</h2>
                <div class="current-devices" id="currentDevices"></div>
                
                <div id="loadingIndicator" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Connecting to MikroTik devices...</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Preparing...</div>
                </div>
                
                <div id="errorMessage"></div>
                <div id="successMessage"></div>
                <div id="warningMessage"></div>
                <div id="resultsContainer"></div>
                <button class="btn" onclick="goBack()">Back to Device List</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize arrays and variables
        let devices = [];
        let filteredDevices = [];
        let selectedDevices = [];
        let combinedResults = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch devices from API
            fetch('/api/devices')
                .then(response => response.json())
                .then(data => {
                    devices = data.devices;
                    filteredDevices = [...devices];
                    loadDevices();
                    updateDeviceCount();
                })
                .catch(error => {
                    console.error('Error loading devices:', error);
                    showMessage('Error loading devices. Please try again later.', 'error');
                });
        });

        function loadDevices() {
            const deviceGrid = document.getElementById('deviceGrid');
            deviceGrid.innerHTML = '';
            
            filteredDevices.forEach(device => {
                const deviceCard = document.createElement('div');
                deviceCard.className = 'device-card';
                deviceCard.id = `device-${device.ip}`;
                
                // Check if device is selected
                const isSelected = selectedDevices.some(d => d.ip === device.ip);
                if (isSelected) {
                    deviceCard.classList.add('selected');
                }
                
                deviceCard.innerHTML = `
                    <input type="checkbox" class="device-checkbox" 
                           ${isSelected ? 'checked' : ''} 
                           onchange="toggleDeviceSelection(this, ${JSON.stringify(device).replace(/"/g, '&quot;')})">
                    <h3>${device.name}</h3>
                    <p><strong>IP:</strong> ${device.ip}</p>
                    <p><strong>Location:</strong> ${device.location}</p>
                    <span class="status ${device.status}">${device.status.toUpperCase()}</span>
                `;
                
                // Add click handler for card (excluding checkbox)
                deviceCard.addEventListener('click', function(e) {
                    if (e.target.type !== 'checkbox') {
                        const checkbox = deviceCard.querySelector('.device-checkbox');
                        checkbox.checked = !checkbox.checked;
                        toggleDeviceSelection(checkbox, device);
                    }
                });
                
                deviceGrid.appendChild(deviceCard);
            });
        }

        function toggleDeviceSelection(checkbox, device) {
            const deviceCard = document.getElementById(`device-${device.ip}`);
            
            if (checkbox.checked) {
                // Add to selected devices
                if (!selectedDevices.some(d => d.ip === device.ip)) {
                    selectedDevices.push(device);
                }
                deviceCard.classList.add('selected');
            } else {
                // Remove from selected devices
                selectedDevices = selectedDevices.filter(d => d.ip !== device.ip);
                deviceCard.classList.remove('selected');
            }
            
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const selectedCount = document.getElementById('selectedCount');
            const batchConnectBtn = document.getElementById('batchConnectBtn');
            
            selectedCount.textContent = `${selectedDevices.length} device${selectedDevices.length !== 1 ? 's' : ''} selected`;
            batchConnectBtn.disabled = selectedDevices.length === 0;
        }

        function clearSelection() {
            selectedDevices = [];
            document.querySelectorAll('.device-checkbox').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.querySelectorAll('.device-card').forEach(card => {
                card.classList.remove('selected');
            });
            updateSelectedCount();
        }

        function selectAll() {
            selectedDevices = [...filteredDevices];
            document.querySelectorAll('.device-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });
            document.querySelectorAll('.device-card').forEach(card => {
                card.classList.add('selected');
            });
            updateSelectedCount();
        }

        function filterDevices() {
            const locationFilter = document.getElementById('locationFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            
            filteredDevices = devices.filter(device => {
                const matchesLocation = !locationFilter || device.location === locationFilter;
                const matchesStatus = !statusFilter || device.status === statusFilter;
                const matchesSearch = !searchFilter || 
                    device.name.toLowerCase().includes(searchFilter) ||
                    device.ip.includes(searchFilter);
                
                return matchesLocation && matchesStatus && matchesSearch;
            });
            
            // Update selected devices to only include filtered devices
            selectedDevices = selectedDevices.filter(selected => 
                filteredDevices.some(filtered => filtered.ip === selected.ip)
            );
            
            loadDevices();
            updateDeviceCount();
            updateSelectedCount();
        }

        function updateDeviceCount() {
            const deviceCount = document.getElementById('deviceCount');
            deviceCount.textContent = `Showing ${filteredDevices.length} of ${devices.length} devices`;
        }

        async function connectToSelectedDevices() {
            if (selectedDevices.length === 0) {
                showMessage('Please select at least one device.', 'error');
                return;
            }
            
            // Hide device grid and show results section
            document.getElementById('deviceGrid').parentElement.style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            
            // Show current devices info
            displayCurrentDevices();
            
            // Clear previous results
            combinedResults = [];
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('errorMessage').innerHTML = '';
            document.getElementById('successMessage').innerHTML = '';
            document.getElementById('warningMessage').innerHTML = '';
            
            // Show loading indicator
            document.getElementById('loadingIndicator').classList.remove('hidden');
            
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            let completed = 0;
            let errors = [];
            
            // Process each device
            for (let i = 0; i < selectedDevices.length; i++) {
                const device = selectedDevices[i];
                
                try {
                    // Update progress
                    progressText.textContent = `Connecting to ${device.name}... (${i + 1}/${selectedDevices.length})`;
                    progressFill.style.width = `${(i / selectedDevices.length) * 100}%`;
                    
                    // Make API call
                    const response = await fetch('/api/mikrotik/firewall-list', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            ip: device.ip,
                            command: '/ip firewall address-list print where list="SUSPEND_SOLNET"'
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        if (data.results && data.results.length > 0) {
                            // Add device source to each result
                            const deviceResults = data.results.map(item => ({
                                ...item,
                                deviceName: device.name,
                                deviceIP: device.ip,
                                deviceLocation: device.location
                            }));
                            
                            combinedResults.push(...deviceResults);
                            completed++;
                        } else {
                            // Successfully connected but no results found
                            completed++;
                        }
                    } else {
                        // Connection or authentication failed
                        const errorMsg = data.error || 'Unknown error';
                        if (errorMsg.toLowerCase().includes('ssh') || 
                            errorMsg.toLowerCase().includes('connection') || 
                            errorMsg.toLowerCase().includes('timeout') ||
                            errorMsg.toLowerCase().includes('refused') ||
                            errorMsg.toLowerCase().includes('authentication')) {
                            errors.push(`${device.name} (${device.ip}): Connection failed - ${errorMsg}`);
                        } else {
                            errors.push(`${device.name} (${device.ip}): ${errorMsg}`);
                        }
                    }
                } catch (error) {
                    // Network or other connection errors
                    const errorMsg = error.message || 'Unknown error';
                    if (errorMsg.toLowerCase().includes('fetch') || 
                        errorMsg.toLowerCase().includes('network') || 
                        errorMsg.toLowerCase().includes('failed to fetch')) {
                        errors.push(`${device.name} (${device.ip}): Network error - Check device connectivity`);
                    } else {
                        errors.push(`${device.name} (${device.ip}): ${errorMsg}`);
                    }
                }
                
                // Update progress
                progressFill.style.width = `${((i + 1) / selectedDevices.length) * 100}%`;
            }
            
            // Hide loading indicator
            document.getElementById('loadingIndicator').classList.add('hidden');
            
            // Display results
            displayCombinedResults();
            
            // Show status messages
            if (completed > 0) {
                const successfulDevices = selectedDevices.length - errors.length;
                showMessage(`Successfully connected to ${successfulDevices} of ${selectedDevices.length} devices.`, 'success');
            }
            
            if (errors.length > 0) {
                const errorMessage = `Failed to connect to ${errors.length} device(s):<br>` + errors.join('<br>');
                showMessage(errorMessage, 'error');
            }
            
            if (combinedResults.length === 0) {
                if (errors.length === selectedDevices.length) {
                    showMessage('Could not connect to any selected devices. Please check device connectivity and SSH access.', 'error');
                } else {
                    showMessage('No suspended addresses found on any accessible device.', 'warning');
                }
            } else {
                const deviceCount = [...new Set(combinedResults.map(r => r.deviceIP))].length;
                showMessage(`Found ${combinedResults.length} suspended addresses from ${deviceCount} device(s).`, 'success');
            }
        }

        function displayCurrentDevices() {
            const currentDevices = document.getElementById('currentDevices');
            
            const deviceTags = selectedDevices.map(device => 
                `<span class="device-tag">${device.name} (${device.ip})</span>`
            ).join('');
            
            currentDevices.innerHTML = `
                <h3>Connected Devices (${selectedDevices.length})</h3>
                <div class="device-list">${deviceTags}</div>
            `;
        }

        function displayCombinedResults() {
            const container = document.getElementById('resultsContainer');
            
            if (combinedResults.length === 0) {
                container.innerHTML = '<p>No suspended addresses found on accessible devices.</p>';
                return;
            }
            
            const table = document.createElement('table');
            table.className = 'results-table';
            
            // Create table header
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th>No.</th>
                    <th>Device Name</th>
                    <th>Device IP</th>
                    <th>CSID</th>
                    <th>IP Address</th>
                    <th>Date Added</th>
                    <th>Location</th>
                </tr>
            `;
            table.appendChild(thead);
            
            // Create table body
            const tbody = document.createElement('tbody');
            combinedResults.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><span class="device-source">${item.deviceName}</span></td>
                    <td>${item.deviceIP}</td>
                    <td>${item.csid}</td>
                    <td>${item.ip}</td>
                    <td>${item.date}</td>
                    <td>${item.deviceLocation}</td>
                `;
                tbody.appendChild(row);
            });
            table.appendChild(tbody);
            
            container.appendChild(table);
            
            // Add summary info
            const summary = document.createElement('div');
            summary.style.marginTop = '20px';
            summary.style.padding = '15px';
            summary.style.background = '#f8fafc';
            summary.style.borderRadius = '8px';
            
            const uniqueDevices = [...new Set(combinedResults.map(r => r.deviceIP))].length;
            const totalSelected = selectedDevices.length;
            const connectionErrors = totalSelected - uniqueDevices;
            
            let summaryText = `<strong>Summary:</strong> Found ${combinedResults.length} suspended addresses from ${uniqueDevices} device(s).`;
            
            if (connectionErrors > 0) {
                summaryText += `<br><small style="color: #dc2626;">Note: ${connectionErrors} device(s) could not be accessed (check SSH connectivity).</small>`;
            }
            
            summary.innerHTML = summaryText;
            container.appendChild(summary);
        }

        function showMessage(message, type) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const warningDiv = document.getElementById('warningMessage');
            
            // Clear all message divs
            errorDiv.innerHTML = '';
            successDiv.innerHTML = '';
            warningDiv.innerHTML = '';
            
            if (type === 'error') {
                errorDiv.innerHTML = `<div class="error">${message}</div>`;
            } else if (type === 'success') {
                successDiv.innerHTML = `<div class="success">${message}</div>`;
            } else if (type === 'warning') {
                warningDiv.innerHTML = `<div class="warning">${message}</div>`;
            }
        }

        function goBack() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('deviceGrid').parentElement.style.display = 'block';
        }
    </script>
</body>
</html>
