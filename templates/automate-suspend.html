<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #4f46e5;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .device-card {
            background: #f8fafc;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .device-card:hover {
            border-color: #4f46e5;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15);
        }

        .device-card.selected {
            border-color: #10b981;
            background: #f0fdf4;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
        }

        .device-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .device-card:hover::before,
        .device-card.selected::before {
            transform: scaleX(1);
        }

        .device-card.selected::before {
            background: linear-gradient(90deg, #10b981, #059669);
        }

        .device-card h3 {
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .device-card p {
            color: #6b7280;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .device-card .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            margin-top: 10px;
        }

        .status.online {
            background: #dcfce7;
            color: #166534;
        }

        .status.offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .device-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 20px;
            height: 20px;
            accent-color: #10b981;
            cursor: pointer;
            z-index: 10;
        }

        .batch-controls {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .selected-count {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .results-table th,
        .results-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .results-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #374151;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .results-table tr:hover {
            background: #f8fafc;
        }

        .results-table td:first-child {
            font-weight: 500;
            color: #4f46e5;
            width: 60px;
            text-align: center;
        }

        .results-table th:first-child {
            width: 60px;
            text-align: center;
        }

        .filter-row th {
            padding: 8px 15px;
            background: #f1f5f9;
            border-bottom: 2px solid #e5e7eb;
        }

        .filter-row th:first-child {
            background: #f8fafc;
            border: none;
        }

        .column-filter {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.8em;
            background: white;
            transition: all 0.3s ease;
        }

        .column-filter:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .column-filter::placeholder {
            color: #9ca3af;
            font-style: italic;
        }

        .filter-controls {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-controls .btn {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .device-source {
            background: #eff6ff;
            color: #1e40af;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }

        /* Sortable table styles */
        .sortable-header {
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.2s ease;
        }

        .sortable-header:hover {
            background: #e2e8f0 !important;
        }

        .sort-icon {
            margin-left: 8px;
            font-size: 0.8em;
            opacity: 0.5;
        }

        .sortable-header.asc .sort-icon::before {
            content: '▲';
            opacity: 1;
        }

        .sortable-header.desc .sort-icon::before {
            content: '▼';
            opacity: 1;
        }

        .sortable-header:not(.asc):not(.desc) .sort-icon::before {
            content: '⇅';
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #dc2626;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #16a34a;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #f59e0b;
        }

        .btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(79, 70, 229, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn.secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }

        .btn.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .hidden {
            display: none;
        }

        .current-devices {
            background: #eff6ff;
            border: 2px solid #3b82f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .current-devices h3 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .device-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .device-tag {
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .filter-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-section select,
        .filter-section input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-right: 10px;
            font-size: 0.9em;
        }

        .device-count {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .home-button {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .home-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #6b7280;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Login Modal Styles */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-modal {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-modal h2 {
            color: #4f46e5;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .login-form .input-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1f2937;
        }

        .login-form select,
        .login-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }

        .login-form select:focus,
        .login-form textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-form textarea {
            min-height: 80px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .login-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .login-buttons .btn {
            flex: 1;
            justify-content: center;
        }

        .btn-cancel {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }

        .btn-cancel:hover {
            box-shadow: 0 8px 15px rgba(107, 114, 128, 0.3);
        }

        /* Logged in user display */
        .user-info {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .user-info:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .user-info .user-icon {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .user-info.hidden {
            display: none;
        }

        .device-card .status-timestamp {
            font-size: 0.7em;
            color: #9ca3af;
            margin-top: 5px;
        }

        /* Premium signature */
        .signature {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0 0 32px 32px;
            padding: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .signature i {
            color: #4CAF50;
            margin-right: 12px;
            font-size: 1.3rem;
            animation: pulse 2s infinite;
            text-shadow: 0 2px 8px rgba(76, 175, 80, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .developer-name {
            font-weight: 800;
            color: #4CAF50;
            text-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
            letter-spacing: 0.5px;
            font-size: 1.15rem;
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <h2>🔐 MikroTik Login</h2>
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label for="mikrotikUser">Select User:</label>
                    <select id="mikrotikUser" required>
                        <option value="">-- Select User --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="mikrotikPassword">Password:</label>
                    <textarea id="mikrotikPassword" placeholder="Enter MikroTik password..." required></textarea>
                </div>
                <div class="login-buttons">
                    <button type="button" class="btn btn-cancel" onclick="cancelLogin()">Cancel</button>
                    <button type="submit" class="btn success">Login</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <a href="/" class="home-button">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <div class="user-info hidden" id="userInfo">
                <div class="user-icon">👤</div>
                <span id="userDisplay">Not logged in</span>
            </div>
            <h1>MikroTik Dashboard</h1>
            <p>Manage CO Tanjung Balai Karimun</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>CO TANJUNG BALAI KARIMUN</h2>
                
                <div class="batch-controls">
                    <span class="selected-count" id="selectedCount">0 devices selected</span>
                    <button class="btn success" id="batchConnectBtn" onclick="connectToSelectedDevices()" disabled>
                        Connect to Selected Devices
                    </button>
                    <button class="btn secondary" onclick="clearSelection()">Clear Selection</button>
                    <button class="btn secondary" onclick="selectAll()">Select All</button>
                    <button class="btn" id="manualCheckBtn" onclick="manualStatusCheck()">
                        Check Status Now
                    </button>
                </div>
                
                <div class="filter-section">
                    <select id="locationFilter" onchange="filterDevices()">
                        <option value="">All Locations</option>
                        <option value="Azam Branch">CO AZAM</option>
                        <option value="Meral Branch">CO MERAL</option>
                        <option value="Mutiara Branch">CO MUTIARA</option>
                        <option value="PN Branch">CO PN</option>
                        <option value="Office Branch">CO OFFICE</option>
                        <option value="PasirPanjang Branch">CO PASIR PANJANG</option>
                    </select>
                    <select id="statusFilter" onchange="filterDevices()">
                        <option value="">All Status</option>
                        <option value="online">Online</option>
                        <option value="offline">Offline</option>
                    </select>
                    <input type="text" id="searchFilter" placeholder="Search by name or IP..." onkeyup="filterDevices()">
                </div>
                
                <div class="device-count" id="deviceCount"></div>
                
                <div class="device-grid" id="deviceGrid">
                    <!-- Devices will be populated here -->
                </div>
            </div>
            
            <div class="section" id="resultsSection" style="display: none;">
                <h2>Combined Firewall Address List Results</h2>
                <div class="current-devices" id="currentDevices"></div>
                
                <div id="loadingIndicator" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Connecting to MikroTik devices...</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Preparing...</div>
                </div>
                
                <div id="errorMessage"></div>
                <div id="successMessage"></div>
                <div id="warningMessage"></div>
                <div id="resultsContainer"></div>
                <button class="btn" onclick="goBack()">Back to Device List</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize arrays and variables
        let devices = [];
        let filteredDevices = [];
        let selectedDevices = [];
        let combinedResults = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Load credentials immediately
            loadCredentialsAndShowLogin();
            // Fetch devices from API
            loadDevicesWithStatus(true);
        });
        
        function loadDevicesWithStatus(initialLoad = false) {
            const url = initialLoad ? '/api/devices-suspend?check_status=true' : '/api/devices-suspend';
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    devices = data.devices;
                    filteredDevices = [...devices];
                    loadDevices();
                    updateDeviceCount();
                    
                    // Credentials are already loaded on page load
                })
                .catch(error => {
                    console.error('Error loading devices:', error);
                    showMessage('Error loading devices. Please try again later.', 'error');
                    // Credentials are already loaded on page load
                });
        }
        

        
        async function checkDevicesStatusRealtime() {
            if (devices.length === 0) return;
            
            try {
                const deviceIps = devices.map(device => device.ip);
                
                const response = await fetch('/api/devices-suspend/status-check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        device_ips: deviceIps
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const currentTime = new Date().toLocaleTimeString();
                    let statusChanges = 0;
                    
                    // Update device status in memory
                    devices.forEach(device => {
                        if (data.status_results[device.ip]) {
                            const newStatus = data.status_results[device.ip];
                            if (device.status !== newStatus) {
                                device.status = newStatus;
                                device.lastStatusChange = currentTime;
                                updateDeviceCardStatus(device);
                                statusChanges++;
                            }
                        }
                    });
                    
                    // Update filtered devices
                    filteredDevices = devices.filter(device => {
                        const locationFilter = document.getElementById('locationFilter').value;
                        const statusFilter = document.getElementById('statusFilter').value;
                        const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
                        
                        const matchesLocation = !locationFilter || device.location === locationFilter;
                        const matchesStatus = !statusFilter || device.status === statusFilter;
                        const matchesSearch = !searchFilter || 
                            device.name.toLowerCase().includes(searchFilter) ||
                            device.ip.includes(searchFilter);
                        
                        return matchesLocation && matchesStatus && matchesSearch;
                    });
                    
                    updateDeviceCount();
                    
                    // Show success message
                    if (statusChanges > 0) {
                        showMessage(`Status check completed: ${statusChanges} device(s) status changed`, 'success');
                    } else {
                        showMessage(`Status check completed at ${currentTime} - No changes detected`, 'success');
                    }
                }
            } catch (error) {
                console.error('Error checking device status:', error);
                showMessage('Status check failed. Please try again.', 'error');
            }
        }
        
        function updateDeviceCardStatus(device) {
            const deviceCard = document.getElementById(`device-${device.ip}`);
            if (deviceCard) {
                const statusElement = deviceCard.querySelector('.status');
                if (statusElement) {
                    statusElement.className = `status ${device.status}`;
                    statusElement.textContent = device.status.toUpperCase();
                    
                    // Add visual feedback for status change
                    deviceCard.style.transform = 'scale(1.02)';
                    deviceCard.style.transition = 'transform 0.3s ease';
                    setTimeout(() => {
                        deviceCard.style.transform = '';
                    }, 300);
                }
                
                // Update or add timestamp
                let timestampElement = deviceCard.querySelector('.status-timestamp');
                if (!timestampElement) {
                    timestampElement = document.createElement('div');
                    timestampElement.className = 'status-timestamp';
                    deviceCard.appendChild(timestampElement);
                }
                
                if (device.lastStatusChange) {
                    timestampElement.textContent = `Last updated: ${device.lastStatusChange}`;
                }
            }
        }
        
        function manualStatusCheck() {
            const button = document.getElementById('manualCheckBtn');
            if (button) {
                button.disabled = true;
                button.textContent = 'Checking...';
            }

                const matchesSearch = !searchFilter ||

        async function connectToSelectedDevices() {
    if (selectedDevices.length === 0) {
        showMessage('Please select at least one device.', 'error');
        return;
    }
    
    // Hide device grid and show results section
    document.getElementById('deviceGrid').parentElement.style.display = 'none';
    document.getElementById('resultsSection').style.display = 'block';
    
    // Show current devices info
    displayCurrentDevices();
    
    // Clear previous results
    combinedResults = [];
    document.getElementById('resultsContainer').innerHTML = '';
    document.getElementById('errorMessage').innerHTML = '';
    document.getElementById('successMessage').innerHTML = '';
    document.getElementById('warningMessage').innerHTML = '';
    
    // Show loading indicator
    document.getElementById('loadingIndicator').classList.remove('hidden');
    
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    
    // Track different types of results
    let devicesWithData = [];           // Successfully connected with suspended addresses
    let devicesWithoutData = [];        // Successfully connected but no suspended addresses
    let connectionFailures = [];        // Failed to connect via SSH/network
    
    // Process each device
    for (let i = 0; i < selectedDevices.length; i++) {
        const device = selectedDevices[i];
        
        try {
            // Update progress
            progressText.textContent = `Connecting to ${device.name}... (${i + 1}/${selectedDevices.length})`;
            progressFill.style.width = `${(i / selectedDevices.length) * 100}%`;
            
            // Make API call with credentials
            const response = await fetch('/api/mikrotik/firewall-list', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ip: device.ip,
                    command: '/ip firewall address-list print where list="SUSPEND_SOLNET"',
                    username: mikrotikCredentials.user,
                    password: mikrotikCredentials.password
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                if (data.results && data.results.length > 0) {
                    // Add device source to each result
                    const deviceResults = data.results.map(item => ({
                        ...item,
                        deviceName: device.name,
                        deviceIP: device.ip,
                        deviceLocation: device.location
                    }));
                    
                    combinedResults.push(...deviceResults);
                    devicesWithData.push(device);
                } else {
                    // Successfully connected but no results found
                    devicesWithoutData.push(device);
                }
            } else {
                // Connection or authentication failed
                const errorMsg = data.error || 'Unknown error';
                connectionFailures.push({
                    device: device,
                    error: errorMsg
                });
            }
        } catch (error) {
            // Network or other connection errors
            const errorMsg = error.message || 'Unknown error';
            connectionFailures.push({
                device: device,
                error: `Network error - ${errorMsg}`
            });
        }
        
        // Update progress
        progressFill.style.width = `${((i + 1) / selectedDevices.length) * 100}%`;
    }
    
    // Hide loading indicator
    document.getElementById('loadingIndicator').classList.add('hidden');
    
    // Display results
    displayCombinedResults();
    
    // Show detailed status messages
    showDetailedResults(devicesWithData, devicesWithoutData, connectionFailures);
}

        function showDetailedResults(devicesWithData, devicesWithoutData, connectionFailures) {
    let messages = [];
    
    // Success message for devices with data
    if (devicesWithData.length > 0) {
        const deviceNames = devicesWithData.map(d => `${d.name} (${d.ip})`).join(', ');
        messages.push({
            type: 'success',
            content: `✅ Found suspended addresses on ${devicesWithData.length} device(s): ${deviceNames}`
        });
    }
    
    // Warning message for devices without data (but connected successfully)
    if (devicesWithoutData.length > 0) {
        const deviceNames = devicesWithoutData.map(d => `${d.name} (${d.ip})`).join(', ');
        messages.push({
            type: 'warning',
            content: `⚠️ Connected successfully but no suspended addresses found on ${devicesWithoutData.length} device(s): ${deviceNames}`
        });
    }
    
    // Error message for connection failures
    if (connectionFailures.length > 0) {
        const deviceDetails = connectionFailures.map(failure => 
            `• ${failure.device.name} (${failure.device.ip}): ${failure.error}`
        ).join('<br>');
        
        messages.push({
            type: 'error',
            content: `❌ Failed to connect to ${connectionFailures.length} device(s):<br>${deviceDetails}`
        });
    }
    
    // Display messages in order: success, warning, error
    messages.forEach(msg => {
        showMessage(msg.content, msg.type);
    });
    
    // Overall summary
    const totalDevices = selectedDevices.length;
    const successfulConnections = devicesWithData.length + devicesWithoutData.length;
    const totalSuspendedAddresses = combinedResults.length;
    
    if (totalSuspendedAddresses === 0 && successfulConnections === 0) {
        showMessage('🔴 Could not connect to any selected devices. Please check device connectivity and SSH access.', 'error');
    } else if (totalSuspendedAddresses === 0 && successfulConnections > 0) {
        showMessage('🟡 All accessible devices have no suspended addresses in their firewall list.', 'warning');
    } else {
        showMessage(`📊 Summary: Found ${totalSuspendedAddresses} total suspended addresses from ${devicesWithData.length} device(s) out of ${totalDevices} selected.`, 'success');
    }
}

        // Sorting variables
        let currentSortColumn = -1;
        let currentSortDirection = 'asc';

        function sortTable(columnIndex, dataType) {
            // Determine sort direction
            if (currentSortColumn === columnIndex) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortDirection = 'asc';
                currentSortColumn = columnIndex;
            }

            // Update header classes
            document.querySelectorAll('.sortable-header').forEach(header => {
                header.classList.remove('asc', 'desc');
            });
            
            const currentHeader = document.querySelector(`[data-column="${columnIndex}"]`);
            if (currentHeader) {
                currentHeader.classList.add(currentSortDirection);
            }

            // Sort the filtered results
            filteredResults.sort((a, b) => {
                let valueA, valueB;
                
                switch (columnIndex) {
                    case 1: // Device Name
                        valueA = a.deviceName;
                        valueB = b.deviceName;
                        break;
                    case 2: // Device IP
                        valueA = a.deviceIP;
                        valueB = b.deviceIP;
                        break;
                    case 3: // CSID
                        valueA = a.csid;
                        valueB = b.csid;
                        break;
                    case 4: // IP Address
                        valueA = a.ip;
                        valueB = b.ip;
                        break;
                    case 5: // Date Added
                        valueA = a.date;
                        valueB = b.date;
                        break;
                    case 6: // Location
                        valueA = a.deviceLocation;
                        valueB = b.deviceLocation;
                        break;
                    default:
                        return 0;
                }

                // Handle different data types
                if (dataType === 'ip') {
                    // IP address sorting
                    const ipA = valueA.split('.').map(num => parseInt(num, 10).toString().padStart(3, '0')).join('.');
                    const ipB = valueB.split('.').map(num => parseInt(num, 10).toString().padStart(3, '0')).join('.');
                    valueA = ipA;
                    valueB = ipB;
                } else if (dataType === 'date') {
                    // Date sorting
                    valueA = new Date(valueA);
                    valueB = new Date(valueB);
                } else {
                    // Text sorting (case insensitive)
                    valueA = valueA.toString().toLowerCase();
                    valueB = valueB.toString().toLowerCase();
                }

                if (valueA < valueB) {
                    return currentSortDirection === 'asc' ? -1 : 1;
                }
                if (valueA > valueB) {
                    return currentSortDirection === 'asc' ? 1 : -1;
                }
                return 0;
            });

            // Re-render the table
            renderTableRows();
        }

        function filterTable() {
            const filters = document.querySelectorAll('.column-filter');
            const filterValues = {};
            
            // Get all filter values
            filters.forEach(filter => {
                const column = filter.dataset.column;
                const value = filter.value.toLowerCase().trim();
                if (value) {
                    filterValues[column] = value;
                }
            });
            
            // Apply filters
            filteredResults = combinedResults.filter(item => {
                // Check each filter
                for (const [column, filterValue] of Object.entries(filterValues)) {
                    let cellValue = '';
                    
                    switch (column) {
                        case '1': // Device Name
                            cellValue = item.deviceName.toLowerCase();
                            break;
                        case '2': // Device IP
                            cellValue = item.deviceIP.toLowerCase();
                            break;
                        case '3': // CSID
                            cellValue = item.csid.toLowerCase();
                            break;
                        case '4': // IP Address
                            cellValue = item.ip.toLowerCase();
                            break;
                        case '5': // Date Added
                            cellValue = item.date.toLowerCase();
                            break;
                        case '6': // Location
                            cellValue = item.deviceLocation.toLowerCase();
                            break;
                    }
                    
                    if (!cellValue.includes(filterValue)) {
                        return false;
                    }
                }
                
                return true;
            });
            
            // Re-apply current sorting if any
            if (currentSortColumn !== -1) {
                const currentHeader = document.querySelector(`[data-column="${currentSortColumn}"]`);
                if (currentHeader) {
                    const dataType = currentHeader.onclick.toString().includes("'ip'") ? 'ip' : 
                                   currentHeader.onclick.toString().includes("'date'") ? 'date' : 'text';
                    
                    filteredResults.sort((a, b) => {
                        let valueA, valueB;
                        
                        switch (currentSortColumn) {
                            case 1: valueA = a.deviceName; valueB = b.deviceName; break;
                            case 2: valueA = a.deviceIP; valueB = b.deviceIP; break;
                            case 3: valueA = a.csid; valueB = b.csid; break;
                            case 4: valueA = a.ip; valueB = b.ip; break;
                            case 5: valueA = a.date; valueB = b.date; break;
                            case 6: valueA = a.deviceLocation; valueB = b.deviceLocation; break;
                            default: return 0;
                        }

                        if (dataType === 'ip') {
                            const ipA = valueA.split('.').map(num => parseInt(num, 10).toString().padStart(3, '0')).join('.');
                            const ipB = valueB.split('.').map(num => parseInt(num, 10).toString().padStart(3, '0')).join('.');
                            valueA = ipA; valueB = ipB;
                        } else if (dataType === 'date') {
                            valueA = new Date(valueA); valueB = new Date(valueB);
                        } else {
                            valueA = valueA.toString().toLowerCase(); valueB = valueB.toString().toLowerCase();
                        }

                        if (valueA < valueB) return currentSortDirection === 'asc' ? -1 : 1;
                        if (valueA > valueB) return currentSortDirection === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
            }
            
            renderTableRows();
        }

        function clearTableFilters() {
            // Clear all filter inputs
            document.querySelectorAll('.column-filter').forEach(filter => {
                filter.value = '';
            });
            
            // Reset sorting state
            currentSortColumn = -1;
            currentSortDirection = 'asc';

            document.querySelectorAll('.sortable-header').forEach(header => {
                header.classList.remove('asc', 'desc');

            filteredResults = [...combinedResults];
            renderTableRows();
            
            showMessage('Filters and sorting cleared successfully!', 'success');

        function exportFilteredResults() {
            if (filteredResults.length === 0) {
                showMessage('No data to export.', 'warning');
                return;
            }
            
            // Create CSV content
            const headers = ['No.', 'Device Name', 'Device IP', 'CSID', 'IP Address', 'Date Added', 'Location'];
            const csvContent = [
                headers.join(','),
                ...filteredResults.map((item, index) => [
                    index + 1,
                    `"${item.deviceName}"`,
                    item.deviceIP,
                    item.csid,
                    item.ip,
                    item.date,
                    `"${item.deviceLocation}"`
                ].join(','))
            ].join('\n');
            
            // Create and download file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `suspended_addresses_filtered_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showMessage(`Exported ${filteredResults.length} filtered results to CSV.`, 'success');
        }

                userInfo.classList.remove('hidden');

                userDisplay.textContent = 'Not logged in';
                userInfo.classList.add('hidden');
            }
        }
    </script>
