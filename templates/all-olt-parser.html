<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Data Parser</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
        }

        .home-btn {
            position: absolute;
            top: -10px;
            left: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            color: white;
            text-decoration: none;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .results-section {
            margin-top: 30px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            color: white;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            font-size: 1.1em;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.3s ease;
        }

        tr:hover td {
            background-color: #f8f9ff;
        }

        tr:nth-child(even) td {
            background-color: #f9f9f9;
        }

        .not-found {
            color: #e74c3c;
            font-style: italic;
            font-weight: bold;
        }

        .download-section {
            text-align: center;
            margin-top: 20px;
        }

        .sample-data {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .load-sample-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            font-size: 14px;
            padding: 8px 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <a href="/" class="home-btn">
                <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Home
            </a>
            📡 Device Data Parser
        </h1>
        
        <div class="input-section">
            <label for="rawData">Paste your device data here:</label>
            <textarea id="rawData" placeholder="Paste your device data here..."></textarea>
            
            <div class="sample-data">
                <strong>Sample Data Format:</strong><br>
                0/2/1:1HRS04-SI-BK000598-Puryantid4:b1:06:2c:79:21other type171525/07/30 13:09:31V1.3.10.053Normal<br>
                0/2/1:2HRS04-SI-BK003365-Tiwi Erlia48:35:2e:45:b9:68other type163625/08/10 22:05:58V3.4.00-230831Normal
            </div>
            <button class="load-sample-btn" onclick="loadSampleData()">📋 Load Sample Data</button>
        </div>

        <div class="button-group">
            <button onclick="parseData()">🔍 Parse Data</button>
            <button onclick="clearData()">🗑️ Clear All</button>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="stats" id="stats"></div>
            
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>CSID</th>
                        <th>MAC Address</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>

            <div class="download-section">
                <button onclick="downloadCSV()">💾 Download CSV</button>
                <button onclick="copyToClipboard()">📋 Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        let parsedData = [];

        function parseData() {
            const rawData = document.getElementById('rawData').value.trim();
            
            if (!rawData) {
                alert('Please enter some data to parse!');
                return;
            }

            // Split the text into lines and skip empty lines
            const lines = rawData.split('\n').filter(line => line.trim() !== '');
            
            // Skip header line if it looks like a header
            const dataLines = lines[0].toLowerCase().includes('description') ? lines.slice(1) : lines;
            
            // Regular expressions for pattern matching
            const csidPattern = /SI-BK\d{6}/;
            const macPattern = /([0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2})/i;
            
            parsedData = [];
            
            dataLines.forEach((line, index) => {
                // Extract CSID
                const csidMatch = line.match(csidPattern);
                const csid = csidMatch ? csidMatch[0] : 'Not Found';
                
                // Extract MAC Address
                const macMatch = line.match(macPattern);
                const macAddress = macMatch ? macMatch[1] : 'Not Found';
                
                parsedData.push({
                    csid: csid,
                    macAddress: macAddress
                });
            });

            displayResults();
        }

        function displayResults() {
            const resultsSection = document.getElementById('resultsSection');
            const tableBody = document.getElementById('tableBody');
            const statsDiv = document.getElementById('stats');
            
            // Clear previous results
            tableBody.innerHTML = '';
            
            // Calculate statistics
            const totalRecords = parsedData.length;
            const validCSID = parsedData.filter(item => item.csid !== 'Not Found').length;
            const validMAC = parsedData.filter(item => item.macAddress !== 'Not Found').length;
            
            // Display statistics
            statsDiv.innerHTML = `
                <div class="stat-item">
                    <span class="stat-number">${totalRecords}</span>
                    <span class="stat-label">Total Records</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">${validCSID}</span>
                    <span class="stat-label">Valid CSIDs</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">${validMAC}</span>
                    <span class="stat-label">Valid MACs</span>
                </div>
            `;
            
            // Populate table
            parsedData.forEach((item, index) => {
                const row = tableBody.insertRow();
                const csidCell = row.insertCell(0);
                const macCell = row.insertCell(1);
                
                csidCell.textContent = item.csid;
                macCell.textContent = item.macAddress;
                
                // Style "Not Found" entries
                if (item.csid === 'Not Found') {
                    csidCell.classList.add('not-found');
                }
                if (item.macAddress === 'Not Found') {
                    macCell.classList.add('not-found');
                }
            });
            
            resultsSection.style.display = 'block';
        }

        function loadSampleData() {
            const sampleData = `ONUONU DescriptionMAC AddressTypeDistance(m)Register TimeSoftwareStatus
0/2/1:1HRS04-SI-BK000598-Puryantid4:b1:06:2c:79:21other type171525/07/30 13:09:31V1.3.10.053Normal
0/2/1:2HRS04-SI-BK003365-Tiwi Erlia48:35:2e:45:b9:68other type163625/08/10 22:05:58V3.4.00-230831Normal
0/2/1:3HRS04-SI-BK000292-Antoni Sugandad4:b1:06:79:c7:3cother type152025/08/17 23:36:14V1.3.10.053Normal
0/2/1:4HRS02-SI-BK001658-Muhammad Suhard4:b1:06:08:56:42other type148925/08/05 10:34:10V1.3.10.053Normal
0/2/1:5d4:b1:06:87:71:68other type133925/08/09 12:10:35V1.3.10.053Normal
0/2/1:9HRS01-SI-BK000284-Syafril Halidd4:b1:06:86:3e:76other type156025/08/10 10:34:02V1.3.10.053Normal`;
            
            document.getElementById('rawData').value = sampleData;
        }

        function clearData() {
            document.getElementById('rawData').value = '';
            document.getElementById('resultsSection').style.display = 'none';
            parsedData = [];
        }

        function downloadCSV() {
            if (parsedData.length === 0) {
                alert('No data to download. Please parse some data first!');
                return;
            }

            let csvContent = 'CSID,MAC Address\n';
            parsedData.forEach(item => {
                csvContent += `${item.csid},${item.macAddress}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'device_data.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            if (parsedData.length === 0) {
                alert('No data to copy. Please parse some data first!');
                return;
            }

            let textContent = 'CSID\tMAC Address\n';
            parsedData.forEach(item => {
                textContent += `${item.csid}\t${item.macAddress}\n`;
            });

            navigator.clipboard.writeText(textContent).then(() => {
                alert('Data copied to clipboard!');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = textContent;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Data copied to clipboard!');
            });
        }
    </script>
</body>
</html>
